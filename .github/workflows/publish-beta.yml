name: publish-beta

on:
  push:
    branches: [ master ]
    paths:
        - 'NewLife.Siemens/**'
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Get Version
      run: echo "VERSION=$(date '+%Y.%m%d-beta%H%M')" >> "$GITHUB_ENV"
    - name: Pack
      run: dotnet pack --version-suffix "$VERSION" -c Release -o out NewLife.Siemens/NewLife.Siemens.csproj
    - name: Publish to GitHub Packages
      continue-on-error: true
      run: dotnet nuget push "out/*.nupkg" --skip-duplicate --source https://nuget.pkg.github.com/NewLifeX/index.json --api-key ${{ github.token }}
    - name: Publish to NuGet.org
      run: dotnet nuget push "out/*.nupkg" --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}